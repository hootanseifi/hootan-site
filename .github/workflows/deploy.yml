# After CI passes on main, deploy that commit to the server over SSH with
# ops/deploy.sh from the same commit; it rolls back if the live site fails.
# Run by hand from the Actions tab to deploy any commit.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy (empty = latest main)
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SHA: ${{ inputs.sha || github.event.workflow_run.head_sha || github.sha }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          ssh "$TARGET" "cd ~/hootan-site && git fetch -q origin && git show $SHA:ops/deploy.sh > /tmp/deploy.sh && sh /tmp/deploy.sh $SHA"
